spring.application.name=auth

# --- Server ---
server.port=${SERVER_PORT:8081}

# --- Database (PostgreSQL) ---
# ?????????? ????????? ?????????? ?? docker-compose.yml
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apply auth database schema.sql on startup (PostgreSQL is an external database).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# ?????? ??????????, ? docker-compose ?? ?????????? ????? ${JWT_SECRET:?...}
app.jwt.secret=${JWT_SECRET}

# --- ??????????? / ????????????? email ---
app.registration.require-email-confirmation=${REQUIRE_EMAIL_CONFIRMATION:true}
app.registration.code-ttl-seconds=${REGISTRATION_CODE_TTL_SECONDS:600}

# --- Mail (SMTP) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}