spring.application.name=api-smart-home

app.jwt.secret=${JWT_SECRET}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway applies pending versioned SQL migrations on every application startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Flyway owns schema creation; do not also run schema.sql at startup.
spring.sql.init.mode=never

# --- MQTT ---
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.url=${MQTT_URL}
app.mqtt.client-id=${MQTT_CLIENT_ID}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.telemetry-topic=${MQTT_TELEMETRY_TOPIC:smart-home/telemetry}